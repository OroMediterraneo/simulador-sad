function esc(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function getCase(id) { return CASES.find(c => c.id === id); }
function pct(n) { return Math.round(n * 100); }

function levelFor(p) {
  if (p >= 85) return { label: "Nivel Competente", badge: "bg-emerald-50 text-emerald-700 border-emerald-200", color: "#10b981" };
  if (p >= 60) return { label: "En Desarrollo", badge: "bg-amber-50 text-amber-700 border-amber-200", color: "#f59e0b" };
  return { label: "Necesita Refuerzo", badge: "bg-rose-50 text-rose-700 border-rose-200", color: "#f43f5e" };
}

function startQuiz() {
  const c = getCase(state.caseId);
  state.quiz = {
    caseId: c.id,
    queue: c.questions.map(q => Object.assign({}, q)),
    idx: 0,
    results: [],
    selected: [],
    answered: false,
    order: null
  };
  prepareQuestion();
  setView("quiz");
}

function prepareQuestion() {
  const qz = state.quiz;
  const q = qz.queue[qz.idx];
  qz.order = shuffle(q.options.map((_, i) => i));
  qz.selected = [];
  qz.answered = false;
}

function currentQ() { return state.quiz.queue[state.quiz.idx]; }

function renderQuiz() {
  const qz = state.quiz;
  const c = getCase(qz.caseId);
  const q = currentQ();
  const total = qz.queue.length;
  const progress = Math.round((qz.idx / total) * 100);
  const res = qz.answered ? qz.results[qz.results.length - 1] : null;
  const axis = AXES[q.axis];

  const optionsHtml = qz.order.map((optIdx, pos) => {
    const o = q.options[optIdx];
    const isSel = qz.selected.includes(optIdx);
    const letter = LETTERS[pos];

    if (!qz.answered) {
      return `
        <button type="button" data-action="select-opt" data-i="${optIdx}"
          class="w-full text-left p-4 rounded-xl border transition-all duration-150 flex items-start gap-3.5 group ${
            isSel ? "bg-teal-50/80 border-teal-600 shadow-subtle ring-1 ring-teal-600" : "bg-white border-slate-200/90 hover:border-slate-300 hover:bg-slate-50/50"
          }">
          <span class="w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 transition-colors ${
            isSel ? "bg-teal-600 text-white" : "bg-slate-100 text-slate-600 group-hover:bg-slate-200"
          }">
            ${letter}
          </span>
          <span class="text-xs sm:text-sm font-medium text-slate-800 leading-relaxed pt-0.5">${esc(o.text)}</span>
        </button>`;
    }

    // Estado corregido
    let badgeBorder = "border-slate-200 bg-white opacity-60";
    let statusBadge = "";
    
    if (q.type === "branch") {
      if (o.score === 1) {
        badgeBorder = "border-emerald-500 bg-emerald-50/60 ring-1 ring-emerald-500";
        statusBadge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">Decisión Óptima (1.0 pt)</span>`;
      } else if (o.score > 0) {
        badgeBorder = "border-amber-500 bg-amber-50/60 ring-1 ring-amber-500";
        statusBadge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">Parcial / Mejorable (0.5 pt)</span>`;
      } else {
        badgeBorder = "border-rose-400 bg-rose-50/50";
        statusBadge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-800">Inadecuada (0.0 pt)</span>`;
      }
    } else {
      if (o.correct && isSel) {
        badgeBorder = "border-emerald-500 bg-emerald-50/60 ring-1 ring-emerald-500";
        statusBadge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">Acierto</span>`;
      } else if (o.correct && !isSel) {
        badgeBorder = "border-emerald-400 border-dashed bg-emerald-50/30";
        statusBadge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700">Opción correcta no marcada</span>`;
      } else if (!o.correct && isSel) {
        badgeBorder = "border-rose-500 bg-rose-50/60 ring-1 ring-rose-500";
        statusBadge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-800">Respuesta Incorrecta</span>`;
      }
    }

    return `
      <div class="p-4 rounded-xl border ${badgeBorder} transition-all space-y-2">
        <div class="flex items-start gap-3">
          <span class="w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 bg-white border border-slate-300 text-slate-700">
            ${letter}
          </span>
          <div class="flex-1 space-y-1">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <span class="text-xs sm:text-sm font-semibold text-slate-900 leading-snug">${esc(o.text)}</span>
              ${statusBadge}
            </div>
            <p class="text-xs text-slate-600 leading-relaxed pt-1">${esc(o.feedback)}</p>
          </div>
        </div>
      </div>`;
  }).join("");

  const isLast = qz.idx === qz.queue.length - 1;

  app.innerHTML = `
    <div class="fade-in max-w-3xl mx-auto space-y-6">
      <!-- Barra superior de estado -->
      <div class="flex items-center justify-between text-xs text-slate-500">
        <button data-action="quit" class="hover:text-slate-800 font-semibold flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          Abandonar
        </button>
        <span class="font-bold text-slate-700">Caso ${esc(c.name)} · Pregunta ${qz.idx + 1} de ${total}</span>
        <span class="font-mono">${progress}% completado</span>
      </div>

      <!-- Barra de progreso lineal sutil -->
      <div class="h-1.5 w-full bg-slate-200/80 rounded-full overflow-hidden">
        <div class="h-full bg-teal-600 transition-all duration-300 ease-out" style="width: ${progress}%;"></div>
      </div>

      <!-- Tarjeta Principal de la Pregunta -->
      <article class="bg-white rounded-3xl border border-slate-200/80 p-6 sm:p-8 shadow-clean space-y-5">
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-xs font-bold px-2.5 py-1 rounded-full border flex items-center gap-1.5 ${axis.badge}">
            ${axis.icon}
            ${axis.short}
          </span>
          ${q.type === "branch" ? `<span class="text-xs font-bold px-2.5 py-1 rounded-full bg-violet-50 text-violet-700 border border-violet-200">🔀 Decisión Ramificada</span>` : ""}
          ${q.type === "multi" ? `<span class="text-xs font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 border border-slate-200">☑ Selección Múltiple</span>` : ""}
        </div>

        <h2 class="text-base sm:text-lg font-bold text-slate-900 leading-snug">
          ${esc(q.prompt)}
        </h2>

        <div class="space-y-2.5 pt-1">
          ${optionsHtml}
        </div>

        <!-- Feedback Pedagógico Expandido tras Respuesta -->
        ${qz.answered ? `
          <div class="scale-in pt-4 border-t border-slate-100 space-y-3">
            <div class="p-4 rounded-xl bg-teal-50/70 border border-teal-200/80 space-y-1.5">
              <span class="text-[11px] font-extrabold uppercase tracking-wider text-teal-800 block">Justificación Formativa Oficial</span>
              <p class="text-xs sm:text-sm text-slate-700 leading-relaxed">${esc(q.explanation)}</p>
              ${q.ref ? `<p class="text-[11px] text-teal-700 font-medium font-mono pt-1">Referencia Temario: ${esc(q.ref)}</p>` : ""}
            </div>
          </div>
        ` : ""}

        <!-- Controles de Envío y Avance -->
        <div class="pt-4 flex items-center justify-between border-t border-slate-100">
          <span class="text-[11px] text-slate-400 hidden sm:inline">Usa los números del teclado o click</span>
          <div>
            ${!qz.answered ? `
              <button data-action="confirm" ${qz.selected.length ? "" : "disabled"} 
                class="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-white transition ${
                  qz.selected.length ? "bg-teal-600 hover:bg-teal-700 shadow-sm" : "bg-slate-300 cursor-not-allowed"
                }">
                Confirmar Elección
              </button>
            ` : `
              <button data-action="next" id="btn-next" class="px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-white bg-slate-900 hover:bg-teal-700 shadow-sm transition flex items-center gap-1.5">
                ${isLast ? "Ver Informe Final" : "Continuar"}
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
              </button>
            `}
          </div>
        </div>
      </article>
    </div>
  `;

  if (qz.answered) {
    const nextBtn = document.getElementById("btn-next");
    if (nextBtn) nextBtn.focus({ preventScroll: true });
  }
}

function selectOption(i) {
  const qz = state.quiz;
  if (qz.answered) return;
  const q = currentQ();
  if (q.type === "multi") {
    qz.selected = qz.selected.includes(i) ? qz.selected.filter(x => x !== i) : qz.selected.concat(i);
  } else {
    qz.selected = [i];
  }
  renderQuiz();
}

function confirmAnswer() {
  const qz = state.quiz;
  if (qz.answered || !qz.selected.length) return;
  const q = currentQ();
  let score = 0;

  if (q.type === "multi") {
    const totalCorrect = q.options.filter(o => o.correct).length;
    let hits = 0, wrong = 0;
    qz.selected.forEach(i => { if (q.options[i].correct) hits++; else wrong++; });
    score = Math.max(0, (hits - wrong) / totalCorrect);
  } else if (q.type === "branch") {
    const chosen = q.options[qz.selected[0]];
    score = chosen.score;
    if (chosen.next) {
      qz.queue.splice(qz.idx + 1, 0, Object.assign({}, chosen.next, { isFollowUp: true, axis: chosen.next.axis || q.axis }));
    }
  } else {
    score = q.options[qz.selected[0]].correct ? 1 : 0;
  }

  qz.results.push({ q, score, selected: qz.selected.slice() });
  qz.answered = true;
  renderQuiz();
}

function nextQuestion() {
  const qz = state.quiz;
  if (qz.idx < qz.queue.length - 1) {
    qz.idx++;
    prepareQuestion();
    renderQuiz();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    finishQuiz();
  }
}

/* =========================================================================
   9. VISTAS: INFORME DE DESEMPEÑO Y ANÁLISIS DE COMPETENCIAS
   ========================================================================= */
function finishQuiz() {
  const qz = state.quiz;
  const axes = {};
  AXIS_ORDER.forEach(a => axes[a] = { earned: 0, possible: 0 });
  qz.results.forEach(r => { axes[r.q.axis].earned += r.score; axes[r.q.axis].possible += 1; });

  const earned = qz.results.reduce((s, r) => s + r.score, 0);
  const total = qz.results.length;
  const scorePct = Math.round((earned / total) * 100);

  const axisPct = {};
  AXIS_ORDER.forEach(a => axisPct[a] = axes[a].possible ? Math.round((axes[a].earned / axes[a].possible) * 100) : null);

  const finalResult = {
    caseId: qz.caseId,
    score: scorePct,
    earned,
    total,
    axes,
    axisPct,
    results: qz.results,
    date: new Date()
  };

  state.lastResult = finalResult;

  const prev = store.history[finalResult.caseId];
  store.history[finalResult.caseId] = {
    best: prev ? Math.max(prev.best, scorePct) : scorePct,
    last: scorePct,
    attempts: prev ? prev.attempts + 1 : 1,
    date: finalResult.date.toISOString(),
    axisPct
  };
  saveStore(store);

  setView("results");
}

function renderResults() {
  const r = state.lastResult;
  const c = getCase(r.caseId);
  const lv = levelFor(r.score);
  const R = 44, C = 2 * Math.PI * R;
  const strokeOffset = C * (1 - r.score / 100);

  const axisBreakdown = AXIS_ORDER.map(a => {
    const p = r.axisPct[a];
    if (p === null) return "";
    const ax = AXES[a];
    const alv = levelFor(p);
    return `
      <div class="space-y-1.5">
        <div class="flex items-center justify-between text-xs font-semibold">
          <span class="flex items-center gap-1.5 text-slate-800">
            ${ax.icon}
            ${ax.label}
          </span>
          <span class="text-slate-900 font-bold">${p}%</span>
        </div>
        <div class="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
          <div class="h-full ${ax.bar} rounded-full transition-all duration-700" style="width: ${p}%;"></div>
        </div>
        <div class="flex justify-between text-[10px] text-slate-400 font-medium">
          <span>${r.axes[a].earned.toFixed(1).replace(".0", "")} / ${r.axes[a].possible} pts</span>
          <span class="${p >= 85 ? "text-emerald-700 font-bold" : p >= 60 ? "text-amber-700 font-bold" : "text-rose-700 font-bold"}">${alv.label}</span>
        </div>
      </div>`;
  }).join("");

  const weakAxes = AXIS_ORDER.filter(a => r.axisPct[a] !== null && r.axisPct[a] < 85);

  app.innerHTML = `
    <div class="fade-in max-w-4xl mx-auto space-y-6">
      <div class="no-print flex items-center justify-between text-xs">
        <button data-action="home" class="font-bold text-slate-500 hover:text-slate-800 flex items-center gap-1 transition">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          Volver al catálogo
        </button>
        <div class="flex items-center gap-2">
          <button data-action="print" class="px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-semibold transition">
            🖨 Imprimir Informe
          </button>
          <button data-action="retry" class="px-3 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-semibold transition">
            ↻ Reintentar Caso
          </button>
        </div>
      </div>

      <!-- Tarjeta de Puntuación Principal -->
      <section class="bg-white rounded-3xl border border-slate-200/80 p-6 sm:p-8 shadow-clean print-card">
        <div class="flex flex-col sm:flex-row items-center gap-6 pb-6 border-b border-slate-100">
          <div class="relative w-28 h-28 shrink-0">
            <svg class="w-full h-full -rotate-90" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="${R}" stroke="#f1f5f9" stroke-width="8" fill="none"/>
              <circle cx="50" cy="50" r="${R}" stroke="${lv.color}" stroke-width="8" stroke-linecap="round" fill="none"
                stroke-dasharray="${C}" stroke-dashoffset="${strokeOffset}" class="ring-progress"/>
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
              <span class="text-2xl font-black text-slate-900">${r.score}%</span>
              <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Global</span>
            </div>
          </div>

          <div class="flex-1 text-center sm:text-left space-y-1">
            <div class="inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-0.5 rounded-full border ${lv.badge}">
              ${lv.label}
            </div>
            <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">
              Informe de Aptitud: Caso ${esc(c.name)}
            </h1>
            <p class="text-xs text-slate-500">
              Estudiante: <span class="font-bold text-slate-800">${esc(store.student || "Auxiliar")}</span> • Fecha: ${r.date.toLocaleDateString("es-ES")}
            </p>
          </div>
        </div>

        <div class="grid md:grid-cols-2 gap-8 pt-6">
          <div class="space-y-4">
            <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Desglose Competencial (4 Ejes)</h2>
            <div class="space-y-4 bg-slate-50/50 p-4 rounded-2xl border border-slate-100">
              ${axisBreakdown}
            </div>
          </div>

          <div class="space-y-4">
            <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Refuerzo Formativo Personalizado</h2>
            ${weakAxes.length ? `
              <div class="space-y-2.5">
                ${weakAxes.map(a => `
                  <div class="p-3.5 rounded-xl border border-slate-200 bg-white space-y-1 shadow-subtle">
                    <span class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                      ${AXES[a].icon}
                      ${AXES[a].short} (${r.axisPct[a]}%)
                    </span>
                    <p class="text-xs text-slate-600 leading-relaxed">${esc(c.refuerzo[a])}</p>
                  </div>
                `).join("")}
              </div>
            ` : `
              <div class="p-4 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-800 text-xs leading-relaxed font-medium">
                ¡Enhorabuena! Has alcanzado el rango de competencia en todos los ejes del caso. Tu criterio cumple los estándares del Real Decreto 1379/2008.
              </div>
            `}

            <div class="p-4 rounded-xl bg-slate-900 text-white space-y-2">
              <span class="text-xs font-bold text-teal-400 block uppercase tracking-wider">Puntos Clave del Caso</span>
              <ul class="text-xs text-slate-300 space-y-1 list-disc pl-4">
                ${c.keyPoints.map(kp => `<li>${esc(kp)}</li>`).join("")}
              </ul>
            </div>
          </div>
        </div>
      </section>
    </div>
  `;
}

/* =========================================================================
   10. VISTAS: BASE DE CONOCIMIENTO TÉCNICA
   ========================================================================= */
function renderKB() {
  const current = KB.find(k => k.id === state.kbOpen) || KB[0];

  const sidebarNav = KB.map(k => `
    <button data-action="kb-open" data-id="${k.id}"
      class="w-full text-left px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center gap-2.5 ${
        k.id === current.id ? "bg-teal-600 text-white shadow-sm" : "bg-white text-slate-600 hover:bg-slate-50 border border-slate-200/70"
      }">
      <span>${k.icon}</span>
      <span class="truncate">${esc(k.title)}</span>
    </button>
  `).join("");

  app.innerHTML = `
    <div class="fade-in max-w-5xl mx-auto space-y-6">
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Manual de Referencia Rápida SAD</h1>
        <p class="text-xs sm:text-sm text-slate-500">Fundamentos teóricos y protocolos oficiales del certificado de profesionalidad SSCS0108.</p>
      </div>

      <div class="grid lg:grid-cols-4 gap-6 items-start">
        <aside class="space-y-2 lg:sticky lg:top-24">
          <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-2 block">Capítulos del Manual</span>
          ${sidebarNav}
        </aside>

        <article class="lg:col-span-3 bg-white rounded-3xl border border-slate-200/80 p-6 sm:p-8 shadow-clean kb-prose">
          <div class="flex items-center gap-2.5 pb-4 border-b border-slate-100 mb-4">
            <span class="text-2xl">${current.icon}</span>
            <h2 class="text-lg font-black text-slate-900 tracking-tight">${esc(current.title)}</h2>
          </div>
          ${current.html}
        </article>
      </div>
    </div>
  `;
}

/* =========================================================================
   11. RENDER PRINCIPAL Y CONTROLADOR DE EVENTOS
   ========================================================================= */
function render() {
  switch (state.view) {
    case "case": renderCase(); break;
    case "quiz": renderQuiz(); break;
    case "results": renderResults(); break;
    case "kb": renderKB(); break;
    default: renderHome();
  }
}

// Lightbox
function openLightbox(src, cap) {
  const lb = document.getElementById("lightbox");
  document.getElementById("lightbox-img").src = src;
  document.getElementById("lightbox-cap").textContent = cap;
  lb.classList.remove("hidden");
}
function closeLightbox() {
  document.getElementById("lightbox").classList.add("hidden");
}

// Event Delegator
document.addEventListener("click", e => {
  const lb = document.getElementById("lightbox");
  if (e.target === lb) { closeLightbox(); return; }

  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const a = btn.dataset.action;

  switch (a) {
    case "home": state.quiz = null; setView("home"); break;
    case "kb": setView("kb"); break;
    case "kb-open": state.kbOpen = btn.dataset.id; renderKB(); break;
    case "filter": state.filter = btn.dataset.filter; renderHome(); break;
    case "open-case": state.caseId = btn.dataset.id; setView("case"); break;
    case "start": startQuiz(); break;
    case "select-opt": selectOption(Number(btn.dataset.i)); break;
    case "confirm": confirmAnswer(); break;
    case "next": nextQuestion(); break;
    case "quit":
      if (confirm("¿Deseas salir del cuestionario en curso? Tu progreso se reiniciará.")) { state.quiz = null; setView("case"); }
      break;
    case "retry": startQuiz(); break;
    case "print": window.print(); break;
    case "zoom": openLightbox(btn.dataset.src, btn.dataset.cap); break;
    case "close-lightbox": closeLightbox(); break;
  }
});

// Input de Nombre de Estudiante
document.addEventListener("input", e => {
  if (e.target.id === "student-input") {
    store.student = e.target.value.trim() || "Auxiliar SAD";
    saveStore(store);
    renderNav();
  }
});

// Atajos de Teclado
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeLightbox(); return; }
  if (state.view !== "quiz" || !state.quiz) return;
  if (e.target.tagName === "INPUT") return;

  const qz = state.quiz;
  if (!qz.answered && /^[1-6]$/.test(e.key)) {
    const pos = Number(e.key) - 1;
    if (pos < qz.order.length) {
      e.preventDefault();
      selectOption(qz.order[pos]);
    }
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (!qz.answered) confirmAnswer(); else nextQuestion();
  }
});

// Inicialización
renderNav();
render();
</script>
